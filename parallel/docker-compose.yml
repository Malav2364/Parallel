version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: parallel-postgres
    environment:
      POSTGRES_USER: parallel_user
      POSTGRES_PASSWORD: parallel123
      POSTGRES_DB: parallel_identity_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallel_user -d parallel_identity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: parallel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  identity:
    build:
      context: ./services/identity
    container_name: parallel-identity
    ports:
      - "8001:8000"
    volumes:
      - ./services/identity:/app
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://parallel_user:parallel123@postgres:5432/parallel_identity_db
      JWT_SECRET_KEY: development-secret-key-change-me
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USERNAME: dev-email@gmail.com
      SMTP_PASSWORD: dev-password
      SMTP_FROM: dev-email@gmail.com
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  projects:
    build:
      context: ./services/projects
    container_name: parallel-projects
    ports:
      - "8002:8000"
    volumes:
      - ./services/projects:/app
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://parallel_user:parallel123@postgres:5432/projects_db
      JWT_SECRET_KEY: development-secret-key-change-me
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USERNAME: dev-email@gmail.com
      SMTP_PASSWORD: dev-password
      SMTP_FROM: dev-email@gmail.com
      FRONTEND_URL: http://localhost:3000
      ADMIN_EMAIL: admin@example.com
    depends_on:
      postgres:
        condition: service_healthy

  spaces:
    build:
      context: ./
      dockerfile: services/spaces/Dockerfile
    container_name: parallel-spaces
    ports:
      - "8003:8000"
    volumes:
      - ./services/spaces:/app/services/spaces
      - ./pios_kernel:/app/pios_kernel
    environment:
      DATABASE_URL: postgresql+psycopg://parallel_user:parallel123@postgres:5432/pios_workspace
    depends_on:
      postgres:
        condition: service_healthy

  goals:
    build:
      context: ./services/goals
    container_name: parallel-goals
    ports:
      - "8005:8000"
    volumes:
      - ./services/goals:/app
    environment:
      DATABASE_URL: postgresql+psycopg://parallel_user:parallel123@postgres:5432/pios_goals
    depends_on:
      postgres:
        condition: service_healthy

  context:
    build:
      context: ./services/context
    container_name: parallel-context
    ports:
      - "8004:8000"
    volumes:
      - ./services/context:/app
    environment:
      DATABASE_URL: postgresql+psycopg://parallel_user:parallel123@postgres:5432/parallel_context
      APP_NAME: Parallel Context Service
      APP_VERSION: 1.0.0
      GOALS_SERVICE_URL: http://goals:8000/api/v1
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      goals:
        condition: service_started

  notifications:
    build:
      context: ./services/notifications
    container_name: parallel-notifications
    volumes:
      - ./services/notifications:/app
    environment:
      DATABASE_URL: postgresql+psycopg://parallel_user:parallel123@postgres:5432/pios_notifications
    depends_on:
      postgres:
        condition: service_healthy

  github:
    build:
      context: ./services/github
    container_name: parallel-github
    volumes:
      - ./services/github:/app
    environment:
      DATABASE_URL: postgresql+psycopg://parallel_user:parallel123@postgres:5432/pios_github
      CONNECTOR_VAULT_KEY: ${CONNECTOR_VAULT_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  github-worker:
    build:
      context: ./services/github
    container_name: parallel-github-worker
    command: ["uv", "run", "python", "-m", "app.worker_main"]
    volumes:
      - ./services/github:/app
    environment:
      DATABASE_URL: postgresql+psycopg://parallel_user:parallel123@postgres:5432/pios_github
      CONNECTOR_VAULT_KEY: ${CONNECTOR_VAULT_KEY}
      NOTIFICATIONS_SERVICE_URL: http://notifications:8000/api/v1
      WATCHER_POLL_INTERVAL: "300"
    depends_on:
      postgres:
        condition: service_healthy
      github:
        condition: service_started
      notifications:
        condition: service_started

  gateway:
    build:
      context: ./services/gateway
    container_name: parallel-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./services/gateway:/app
    environment:
      APP_NAME: Parallel API Gateway
      APP_VERSION: 1.0.0
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: 8000
      IDENTITY_SERVICE_URL: http://identity:8000/api/v1
      PROJECTS_SERVICE_URL: http://projects:8000/api/v1/projects
      WORKSPACE_SERVICE_URL: http://spaces:8000/api/v1
      CONTEXT_SERVICE_URL: http://context:8000/api/v1/context
      GITHUB_SERVICE_URL: http://github:8000/api/v1/github
      JWT_SECRET_KEY: development-secret-key-change-me
      JWT_ALGORITHM: HS256
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: INFO
      FRONTEND_URL: http://localhost:3000
    depends_on:
      identity:
        condition: service_started
      projects:
        condition: service_started
      spaces:
        condition: service_started
      context:
        condition: service_started
      goals:
        condition: service_started
      github:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  postgres_data:
