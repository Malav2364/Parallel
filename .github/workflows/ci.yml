name: Parallel CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  identity_service:
    name: Identity Service CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Parallel/parallel/services/identity

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Dependencies
        run: uv sync

      - name: Check Python Version
        run: python --version

      - name: Ruff Lint
        run: uv run ruff check .

      - name: Black Formatting
        run: uv run black --check .

      - name: Run Tests
        run: |
          if [ -d "tests" ]; then
            uv run pytest --cov=app --cov-report=term-missing
          else
            echo "No tests found"
          fi

      - name: Build Docker Image
        run: docker build -t parallel-identity .
