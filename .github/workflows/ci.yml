name: Parallel CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  identity_service:
    name: Identity Service CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Show Repository Structure
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -type d

      - name: Install Dependencies
        working-directory: parallel/services/identity
        run: uv sync

      - name: Check Python Version
        working-directory: parallel/services/identity
        run: python --version

      - name: Run Tests
        working-directory: parallel/services/identity
        run: |
          if [ -d "tests" ]; then
            uv run pytest
          else
            echo "No tests yet"
          fi

      - name: Build Docker Image
        working-directory: parallel/services/identity
        run: docker build -t parallel-identity .
